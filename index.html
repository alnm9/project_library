<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Project: Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="tableDiv">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Status</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>

                <tbody class="tableBody"></tbody>
            </table>
        </div>
        <div id="formDiv">
            <button id="dialogBtn">Add a new Book to the Collection!</button>

            <dialog>
                <form id="form">
                    <legend>Book Form</legend>
                    <div class="dialogContainer">

                        <div class="formRow">
                            <label for="title">Book Title</label>
                            <input id="title" name="title" type="text" minlength="3" required>
                        </div>

                        <div class="formRow">
                            <label for="author">Book Author</label>
                            <input id="author" type="text" minlength="5" required>
                        </div>

                        <div class="formRow">
                            <label for="pages">Book Pages</label>
                            <input id="pages" type="number" required>
                        </div>

                        <div class="formRow last">
                            <label for="read">What is book's status?</label>
                            <select id="read">
                                <option value="Read">Read</option>
                                <option value="Not read">Not read</option>
                            </select>
                        </div>
                        <div class="btnsContainer">
                            <button class="formBtn" id="addBook">Add book</button>
                            <button class="formBtn" id="closeBtn">Close</button>
                        </div>
                    </div>

                </form>
            </dialog>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
