<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Project: Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="tableDiv">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Read</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>

                <tbody class="tableBody"></tbody>
            </table>
        </div>
        <div id="formDiv">
            <button id="dialogBtn">Add New Book</button>

            <dialog>
                <div class="dialogContainer">
                    <form id="form">
                        <legend>Book Form</legend>
                        <div class="formRow">
                            <label for="title">Book Title</label>
                            <input id="title" type="text" value="">
                        </div>

                        <div class="formRow">
                            <label for="author">Book Author</label>
                            <input id="author" type="text" value="">
                        </div>

                        <div class="formRow">
                            <label for="pages">Book Pages</label>
                            <input id="pages" type="number" value="">
                        </div>

                        <div class="formRow last">
                            <label for="read">Is it read?</label>
                            <select id="read">
                                <option value="yes">yes</option>
                                <option value="no">no</option>
                            </select>
                        </div>
                        <div class="btnsContainer">
                            <button id="addBook">Add book</button>
                            <button id="closeBtn">Close</button>
                        </div>
                    </form>
                </div>
            </dialog>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
